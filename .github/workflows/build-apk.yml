# APK cloud में बनता है (GitHub के Ubuntu runner पर Android SDK पहले से है)।
# main पर push या Actions → "Build APK" → Run workflow → 4-6 मिनट → Releases page पर .apk
name: Build APK

on:
  push:
    branches: [ main, claude/apk-build-9wdz5o ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write   # Release बनाने के लिए

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Keystore तैयार करो (secrets हों तो release key, वरना debug key)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "Signing: RELEASE keystore (updates पुराने install के ऊपर लगेंगी)"
          else
            echo "::warning::KEYSTORE_BASE64 secret नहीं है → DEBUG key से sign होगा। अगली build install करने से पहले पुरानी app uninstall करनी पड़ेगी। 'Make keystore' workflow चलाओ।"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: APK का नाम
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "jcm-loading-v1.0.${{ github.run_number }}.apk"

      - name: Release पर APK लगाओ (phone से सीधे download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JCM लोडिंग app v1.0.${{ github.run_number }}
          body: |
            Phone पर यह .apk खोलो → Install (पहली बार "Install unknown apps" allow करना होगा)।
            Signing: ${{ env.KEYSTORE_PATH != '' && 'release keystore' || 'DEBUG key (update से पहले uninstall)' }}
          files: jcm-loading-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jcm-loading-apk
          path: jcm-loading-v1.0.${{ github.run_number }}.apk
