# एक बार चलाओ: release keystore बनता है → artifact download → repo Settings → Secrets में 4 secrets डालो।
# इसी key से हर build sign होगी → नई APK पुरानी app के ऊपर install होगी (phone का pending data सुरक्षित)।
name: Make keystore (एक बार)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Keystore generate
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.keystore -alias jcm -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Jhaji Chura Mill, O=JCM, L=Madhubani, ST=Bihar, C=IN"
          base64 -w0 release.keystore > KEYSTORE_BASE64.txt
          printf 'KEYSTORE_BASE64 = (KEYSTORE_BASE64.txt की पूरी content)\nKEYSTORE_PASSWORD = %s\nKEY_ALIAS = jcm\nKEY_PASSWORD = %s\n' "$PASS" "$PASS" > SECRETS.txt
          echo "::notice::Artifact download करो → 4 secrets add करो → release.keystore + SECRETS.txt कहीं सुरक्षित रखो → artifact delete कर दो"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-SAVE-THIS-PRIVATELY
          path: |
            release.keystore
            KEYSTORE_BASE64.txt
            SECRETS.txt
          retention-days: 7
